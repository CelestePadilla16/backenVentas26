<section class="view-heading">
    <div>
        <p class="eyebrow">Comprar</p>
        <h1>Cuadros de abarrotes</h1>
        <p>Busca un producto especifico y toca una tarjeta para ver su descripcion, precio y disponibilidad.</p>
    </div>
    <div class="heading-actions">
        <label class="search-box">
            <span>Buscar</span>
            <input type="search" data-product-search placeholder="Ej: arroz, aceite, galletas">
        </label>
        <button class="primary-action" type="button" data-save-products>Guardar cambios</button>
        <p class="sale-message" data-products-message></p>
    </div>
</section>

<section class="catalog-layout">
    <div class="product-grid" data-product-grid></div>
    <aside class="product-detail" data-product-detail></aside>
</section>
